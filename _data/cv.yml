- title: Research Experience
  type: time_table
  contents:
    - title: Code-switching Production and Cognitive Control
      institution: Brain Language and Bilingualism Lab, University of Florida
      year: 2024 - present
      description:
        - Lead a study on how code-switching production shapes cognitive control and conflict adaptation.
        - Designed E-Prime tasks, verbal fluency measures, bilingual profile questionnaires, coding schemes, and statistical analysis workflow.
        - Manage IRB materials and mentor two undergraduate research assistants.
    - title: Moral Judgment and Semantic Violation Project
      institution: Brain Language and Bilingualism Lab, University of Florida
      year: 2023 - present
      description:
        - Designed experimental sentences and materials for an EEG study of moral and semantic violations.
        - Collect EEG data and model N400/P600 ERP responses using language-model surprisal measures.
    - title: Morphological Language Transfer Project
      institution: Brain Development Lab, Vanderbilt University
      year: 2021 - 2023
      description:
        - Recruited participants and collected behavioral and fMRI data on artificial-language learning and derivational morphology.
        - Analyzed response accuracy, reaction time, and individual differences in learning outcomes.

